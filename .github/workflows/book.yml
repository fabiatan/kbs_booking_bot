name: KBS Booking Bot

on:
  schedule:
    - cron: '50 15 * * 0,3-6'  # 11:50 PM MYT (UTC+8) Wed-Sun — Mon/Tue skipped (target=weekend)
    - cron: '0 17 * * 2-6'      # 1:00 AM MYT (UTC+8) Wed-Sun
  workflow_dispatch:
    inputs:
      poll_timeout:
        description: 'Poll timeout in seconds'
        required: false
        default: '2600'
        type: string
      date:
        description: 'Specific date to book (DD/MM/YYYY), leave empty for auto'
        required: false
        default: ''
        type: string
      days_ahead:
        description: 'Number of days ahead to book (default: 60)'
        required: false
        default: '60'
        type: string
      time_start:
        description: 'Start time (HH:MM:SS), leave empty for auto'
        required: false
        default: ''
        type: string
      time_end:
        description: 'End time (HH:MM:SS), leave empty for auto'
        required: false
        default: ''
        type: string

jobs:
  book:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      
      - name: Run booking bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          USERNAME="${{ secrets.KBS_USERNAME_PERSONAL }}"
          PASSWORD="${{ secrets.KBS_PASSWORD_PERSONAL }}"

          python kbs_booker_bot.py \
            -u "$USERNAME" \
            -p "$PASSWORD" \
            ${{ inputs.days_ahead && format('--days-ahead {0}', inputs.days_ahead) || '' }} \
            ${{ inputs.date != '' && format('-d "{0}"', inputs.date) || '' }} \
            ${{ inputs.poll_timeout && format('--poll-timeout {0}', inputs.poll_timeout) || '' }} \
            ${{ inputs.time_start != '' && format('-ts "{0}"', inputs.time_start) || '' }} \
            ${{ inputs.time_end != '' && format('-te "{0}"', inputs.time_end) || '' }}
